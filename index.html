<!doctype html>
<html lang="en">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive WebGL cloth banner built with a custom Verlet particle grid, constraint solver, and runtime-generated silk texture."
    />
